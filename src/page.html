<title>Kaskáda</title>
<!--FONTS-->
<style>
/* Layout: herní HUD nahoře, pod ním přepínané obrazovky (mapa / úroveň / profil / žebříček).
   Barvy modulů = barvy box-modelu z DevTools (content, padding, border, margin). */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#e9edf4; --ink:#14203a; --ink-2:#4a5775; --line:#d3dae6;
  --accent:#2f5bd3; --accent-ink:#ffffff; --good:#15803d; --good-bg:#dcf2e3; --warn:#a15c07; --warn-bg:#fdf0d8; --bad:#b4233a; --bad-bg:#fbe3e7;
  --m-content:#8cb6c0; --m-padding:#b9c77a; --m-border:#f2c96b; --m-margin:#f3b184;
  --code-bg:#0f1830; --code-ink:#e6ecff; --code-dim:#7f8cb0;
  --gold:#d59b0c;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c1222; --surface:#141c31; --surface-2:#1c2640; --ink:#e8edfa; --ink-2:#a3aecb; --line:#2a3656;
  --accent:#7ea2ff; --accent-ink:#0c1222; --good:#5fd08a; --good-bg:#12321f; --warn:#f0b457; --warn-bg:#3a2a0e; --bad:#ff7d8f; --bad-bg:#3d1520;
  --m-content:#6ea4b1; --m-padding:#9fb05a; --m-border:#e0b24c; --m-margin:#e39a68;
  --code-bg:#080d1a; --code-ink:#e6ecff; --code-dim:#6d7a9e; --gold:#f2c14e; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0c1222; --surface:#141c31; --surface-2:#1c2640; --ink:#e8edfa; --ink-2:#a3aecb; --line:#2a3656;
  --accent:#7ea2ff; --accent-ink:#0c1222; --good:#5fd08a; --good-bg:#12321f; --warn:#f0b457; --warn-bg:#3a2a0e; --bad:#ff7d8f; --bad-bg:#3d1520;
  --m-content:#6ea4b1; --m-padding:#9fb05a; --m-border:#e0b24c; --m-margin:#e39a68;
  --code-bg:#080d1a; --code-ink:#e6ecff; --code-dim:#6d7a9e; --gold:#f2c14e; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
code,.mono{font-family:var(--f-mono);font-size:.9em}
p code,li code{background:var(--surface-2);padding:1px 5px;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hud-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand b{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand span{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.player{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--surface-2);object-fit:cover;flex:none}
.lvlchip{font-family:var(--f-display);font-weight:800;font-size:13px;background:var(--ink);color:var(--bg);border-radius:6px;padding:2px 7px}
.xpbox{display:grid;gap:3px;min-width:150px}
.xpbox .row1{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-2)}
.xpbox .row1 b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--m-content),var(--m-padding),var(--m-border),var(--m-margin));border-radius:99px;transition:width .6s ease}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:13px;white-space:nowrap}
.chip.done{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.todo{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.flame{font-family:var(--f-display);font-weight:800}
nav.tabs{display:flex;gap:4px;padding-bottom:8px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:700;color:var(--ink-2);white-space:nowrap}
nav.tabs button[aria-current="page"]{background:var(--surface-2);color:var(--ink)}

main{padding-block:22px 60px}
.view-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.view-head h2{font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:-.02em}
.view-head p{margin:4px 0 0;color:var(--ink-2);max-width:60ch}

/* MAP */
.module{margin-bottom:26px}
.mod-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.mod-sw{width:34px;height:34px;border-radius:8px;flex:none;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:12px;color:#14203a}
.mod-head h3{font-size:20px}
.mod-head small{color:var(--ink-2);display:block;font-size:13px}
.mod-prog{margin-left:auto;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.nodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.node{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:6px;min-width:0;transition:transform .15s ease, border-color .15s}
.node:hover:not(:disabled){transform:translateY(-2px);border-color:var(--accent)}
.node:disabled{cursor:not-allowed;opacity:.55}
.node .n{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.node b{font-family:var(--f-display);font-size:17px}
.node .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-2)}
.node.next{border:2px solid var(--accent);padding:13px}
.node.next::after{content:"Další na řadě";position:absolute;top:-10px;right:10px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px}
.stars{display:inline-flex;gap:2px}
.stars svg{width:15px;height:15px}
.stars .on{fill:var(--gold)} .stars .off{fill:var(--line)}
.soon{border:1px dashed var(--line);border-radius:var(--r);padding:14px;color:var(--ink-2);font-size:14px}

/* PLAY */
.play{display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.18fr);gap:18px;align-items:start}
main.wide-play{max-width:1560px}
@media (max-width:900px){.play{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-bottom:8px}
.crumbs button{border:0;background:none;padding:0;color:var(--accent);font-weight:700}
.lesson h2{font-size:28px;font-weight:800;letter-spacing:-.01em;margin-bottom:6px}
.lesson .theory{color:var(--ink);max-width:62ch}
.lesson .theory p{margin:.5em 0}
.task{margin-top:12px;background:var(--surface-2);border-radius:8px;padding:12px 14px}
.task h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.checks{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px}
.checks li{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.checks .dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-top:1px;display:grid;place-items:center}
.checks li.ok .dot{background:var(--good);border-color:var(--good)}
.checks li.ok .dot::after{content:"";width:5px;height:9px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.checks li.ok{color:var(--good)}
.hints{margin-top:14px;display:grid;gap:8px}
.hint{background:var(--warn-bg);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:14px}
.hint b{color:var(--warn)}
.helpbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:700;font-size:14px}
.btn:hover:not(:disabled){border-color:var(--ink-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{background:var(--surface-2);border-color:var(--line);color:var(--ink-2)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn small{font-weight:400;opacity:.8}
.solution{margin-top:10px;background:var(--bad-bg);border-radius:8px;padding:10px 12px;font-size:14px}
.solution pre{margin:8px 0;background:var(--code-bg);color:var(--code-ink);padding:10px;border-radius:6px;overflow-x:auto;font-family:var(--f-mono);font-size:13px}

.editor{border-radius:var(--r);overflow:hidden;background:var(--code-bg);border:1px solid var(--line)}
.ed-head{display:flex;align-items:center;gap:8px;padding:8px 12px;color:var(--code-dim);font-family:var(--f-mono);font-size:12px;border-bottom:1px solid #ffffff14}
.ed-head .dots{display:flex;gap:5px}
.ed-head .dots i{width:9px;height:9px;border-radius:50%;background:#ffffff22}
.ed-head .timer{margin-left:auto;font-variant-numeric:tabular-nums}
.ed-body{display:grid;grid-template-columns:auto minmax(0,1fr)}
.gutter{padding:12px 8px 12px 12px;text-align:right;color:var(--code-dim);font-family:var(--f-mono);font-size:14px;line-height:1.6;user-select:none;white-space:pre}
.ed-wrap{position:relative;min-width:0;display:grid}
.ed-wrap textarea,.ed-wrap .hl{font-family:var(--f-mono);font-size:14px;line-height:1.6;padding:12px 12px 12px 4px;tab-size:2;white-space:pre;letter-spacing:0;word-spacing:0;font-variant-ligatures:none}
.ed-wrap textarea{grid-area:1/1;width:100%;min-height:210px;resize:vertical;border:0;outline:0;background:transparent;color:transparent;caret-color:#ffffff;overflow-x:auto;position:relative;z-index:1}
.ed-wrap textarea::selection{background:#7ea2ff55;color:transparent}
.ed-wrap .hl{grid-area:1/1;margin:0;overflow:hidden;pointer-events:none;color:var(--code-ink)}
.t-sel{color:#8cb6c0}.t-prop{color:#b9c77a}.t-val{color:#f3b184}.t-num{color:#f2c96b}.t-pun{color:#f2c96b}.t-pun2{color:#a3aecb}.t-com{color:#6d7a9e;font-style:italic}.t-at{color:#c4a7ff}.t-str{color:#9ee6b0}.t-fn{color:#7ec8ff}.t-imp{color:#ff7d8f;font-weight:700}.t-var{color:#e2b6ff}
.t-hex{box-shadow:inset 0 -3px 0 var(--sw);border-radius:2px}
.ac{position:absolute;z-index:6;list-style:none;margin:0;padding:4px;min-width:220px;max-width:320px;background:#1b2540;border:1px solid #ffffff26;border-radius:8px;box-shadow:0 10px 30px #0008;font-family:var(--f-mono);font-size:13px;color:var(--code-ink)}
.ac li{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center;padding:4px 8px;border-radius:5px;cursor:pointer}
.ac li i{width:12px;height:12px;border-radius:3px;border:1px solid #ffffff40;grid-row:span 2}
.ac li b{font-weight:600;color:#b9c77a}.ac li span{grid-column:1/-1;font-family:var(--f-body);font-size:11.5px;color:#a3aecb}
.ac li i+b{grid-column:2}.ac li i~span{grid-column:2}
.ac li.on{background:#2f5bd3}.ac li.on b,.ac li.on span{color:#fff}
.ac li.ac-hint{display:block;font-family:var(--f-body);font-size:11px;color:#6d7a9e;cursor:default;padding:4px 8px 2px}
.symbar{display:none;gap:4px;flex-wrap:wrap;padding:6px 8px;border-top:1px solid #ffffff14}
.symbar button{min-width:38px;min-height:36px;border:1px solid #ffffff26;background:#ffffff0d;color:var(--code-ink);border-radius:6px;font-family:var(--f-mono);font-size:15px}
.symbar .ac-btn{font-family:var(--f-body);font-size:13px;font-weight:700;margin-left:auto}
@media (pointer:coarse),(max-width:700px){.symbar{display:flex}}
.editor:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.locked{padding:8px 12px 0;color:var(--code-dim);font-family:var(--f-mono);font-size:12px}

.stages{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.stages.wide{grid-template-columns:1fr}
@media (max-width:520px){.stages{grid-template-columns:1fr}}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.stage .lab{display:flex;justify-content:space-between;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);padding:7px 10px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.stage .host{display:block;position:relative;padding:0;background:#ffffff;color:#14203a;min-height:170px;overflow:auto}
.submitbar{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.submitbar .status{font-size:14px;color:var(--ink-2)}
.potential{margin-left:auto;font-family:var(--f-display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.potential small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--ink-2)}

/* MODAL */
.overlay{position:fixed;inset:0;background:#0a1020a8;display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:14px;max-width:440px;width:100%;padding:24px;display:grid;gap:14px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:28px;font-weight:800}
.bigstars{display:flex;gap:8px;justify-content:center}
.bigstars svg{width:46px;height:46px}
.lines{display:grid;gap:4px;font-size:14px}
.lines div{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.lines .tot{border-top:1px solid var(--line);padding-top:6px;margin-top:4px;font-weight:700;font-size:16px}
.newach{display:grid;gap:6px}
.newach .a{display:flex;gap:10px;align-items:center;background:var(--surface-2);border-radius:8px;padding:8px}

/* PROFILE */
.prof-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.prof-top .avatar{width:72px;height:72px}
.prof-top h2{font-size:30px;font-weight:800}
.title-line{color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:18px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-2)}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ach{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.ach.locked{opacity:.5;filter:grayscale(1)}
.medal{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px;color:#14203a;transform:rotate(-4deg)}
.ach b{display:block;font-family:var(--f-display);font-size:15px}
.ach small{color:var(--ink-2);font-size:12.5px;line-height:1.3;display:block}
h3.sec{font-size:20px;margin:26px 0 10px}

/* BOARD */
.board{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);font-weight:700}
td.num,th.num{text-align:right}
tr.me td{background:var(--surface-2)}
.who{display:flex;align-items:center;gap:10px}
.who img{width:28px;height:28px;border-radius:50%}
.rank{font-family:var(--f-display);font-weight:800;font-size:18px;width:40px}
.rank.r1{color:var(--gold)}
.note{font-size:13px;color:var(--ink-2);margin-top:10px}

/* TOAST */
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:60}
.toast{background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;max-width:320px;box-shadow:0 8px 24px #0004;animation:pop .35s ease}
.toast .medal{width:34px;height:34px;font-size:11px}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- v2: výběr kurzů, konzole JS, filtry ---- */
:root{ --c-css:#8cb6c0; --c-html:#f0a07a; --c-js:#f2d16b; --c-py:#9ec3a0; --c-cs:#b9a7e6 }
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.course{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0;overflow:hidden;display:grid;min-width:0;transition:transform .15s ease,border-color .15s}
.course:hover:not(:disabled){transform:translateY(-3px);border-color:var(--accent)}
.course:disabled{cursor:default}
.course .band{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 16px;color:#14203a;min-height:104px}
.course .band b{font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:-.03em;line-height:1}
.course .band code{font-size:12px;opacity:.75;order:-1;white-space:nowrap}
.course .body{padding:14px 16px 16px;display:grid;gap:8px}
.course .body p{margin:0;color:var(--ink-2);font-size:14px}
.course .foot{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.course.soon{opacity:.72}
.pill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border-radius:99px;padding:2px 8px;background:var(--surface-2);color:var(--ink-2)}
.pill.live{background:var(--good-bg);color:var(--good)}
.pill.beta{background:var(--warn-bg);color:var(--warn)}
.console{background:var(--code-bg);color:var(--code-ink);border-radius:var(--r);margin-top:12px;font-family:var(--f-mono);font-size:13px;overflow:hidden}
.console .lab{display:flex;justify-content:space-between;padding:7px 12px;color:var(--code-dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid #ffffff14}
.console .out{padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;min-height:44px;max-height:180px;overflow:auto}
.console .err{color:#ff9aa8}
.tests{width:100%;min-width:0;border-collapse:collapse}
.tests td{padding:6px 12px;border-bottom:1px solid #ffffff10;color:var(--code-ink);font-size:13px;vertical-align:top;overflow-wrap:anywhere}
.tests td.st{width:26px;font-weight:700}
.tests tr.ok td.st{color:#6ee7a1} .tests tr.ko td.st{color:#ff9aa8}
.tests td.got{color:var(--code-dim)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-weight:700;font-size:13px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cprog{display:grid;gap:10px;margin:14px 0}
.cprog .r{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:12px;align-items:center;font-size:14px}
.cprog .r b{font-family:var(--f-display)}
.cprog .bar i{background:var(--cc)}
.crs-tag{display:inline-grid;place-items:center;min-width:34px;height:22px;padding:0 6px;border-radius:5px;font-family:var(--f-mono);font-size:11px;font-weight:600;color:#14203a}
.tier{border-top:1px solid var(--line);padding-top:18px;margin-top:8px}
.tier.locked .module{opacity:.6}
.tier-head{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(140px,220px);gap:14px;align-items:center;margin-bottom:16px}
@media (max-width:620px){.tier-head{grid-template-columns:auto minmax(0,1fr)}.tier-prog{grid-column:1/-1}}

.pg-c.chk{display:flex;align-items:center;gap:6px;font-family:var(--f-body);font-size:13px;color:var(--ink)}
.pg-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px;align-items:start}@media (max-width:900px){.pg-body{grid-template-columns:1fr}}
.pg-body .stages{margin-top:0}
.cert .cert-share{justify-self:start;margin-top:6px;font-size:13px;padding:6px 10px;position:relative;z-index:1}
.cert-modal{max-width:680px}.cert-img{width:100%;border-radius:8px;border:1px solid var(--line);background:#fff}
.cert-modal input{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
</style>

<header class="hud">
  <div class="wrap">
    <div class="hud-in">
      <div class="brand"><b>Kaskáda</b><span>{ učíme: kód; }</span></div>

      <div class="chip" id="streak" title="Série dní"></div>
      <div class="player">
        <img class="avatar" id="hudAvatar" alt="">
        <div class="xpbox">
          <div class="row1"><span><span class="lvlchip" id="hudLvl">1</span> <span id="hudTitle"></span></span><b id="hudXp">0 XP</b></div>
          <div class="bar"><i id="hudBar" style="width:0"></i></div>
        </div>
      </div>
    </div>
    <nav class="tabs" aria-label="Sekce">

    </nav>
  </div>
</header>

<main class="wrap">

  <section id="v-board" hidden></section>
  <section id="v-gallery" hidden></section>

</main>
